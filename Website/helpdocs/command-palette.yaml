# Search a site from the command palette: type a provider's shortcut, see
# its chips, press Tab to choose it, and type a query. The clip stops before
# Return, so it needs no network.
# Steps: CrestHelpDocs/CommandPaletteArticle.swift. Format: Scripts/helpdocs/README.md.
article: content/docs/(browse-faster)/command-palette.mdx
section: Search a site or ask an assistant
sources:
  - CrestShared/Features/Chrome/Components/BrowserCommandPalette/**
  - CrestShared/Features/Settings/BrowserSearchSettingsPane/**
  - CrestShared/Application/BrowserSearch/**
labels:
  settings: Settings
  search: Search
  tab_to_search: Tab to search providers
  space_to_search: Space to search providers
  search_youtube: Search YouTube
  stop_youtube: Stop searching YouTube
# Bold terms in the section that name keys rather than UI text.
keys: [Tab, Return, Escape, Delete]
# Served on a free local port as {server}: a calm page behind the palette.
serve: fixtures/command-palette
test: CommandPaletteArticle
launch:
  window: [1280, 800]
clip: command-palette/search-a-provider.mp4
clip_zoom: 1.0                   # the palette is wide; zooming on the field click would crop it
