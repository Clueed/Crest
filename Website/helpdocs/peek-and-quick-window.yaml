# Pull a link into Peek on Mac: drag a page link, watch the live preview
# follow the pointer, and release to keep it open as a Peek.
# Steps: CrestHelpDocs/PeekArticle.swift. Format: Scripts/helpdocs/README.md.
article: content/docs/(browse-faster)/peek-and-quick-window.mdx
section: Pull a link into Peek on Mac
sources:
  - CrestMac/Infrastructure/WebKit/LinkDrag/**
  - CrestShared/Application/BrowserTransientBrowsing/Peek/**
  - CrestShared/Features/Settings/BrowserLinkSettingsPane/Components/BrowserPeekSettingsSection.swift
labels:
  settings: Settings
  links: Links
  drag_to_peek: Drag links to Peek
  close: Close Peek
  open_in: Open In…
# Bold terms in the section that name keys rather than UI text.
keys: [Option]
# Served on a free local port as {server} while the scenario runs. Strings
# from these pages are written inline; `labels` holds only Crest's own text.
serve: fixtures/peek
test: PeekArticle
launch:
  window: [1280, 800]
clip: peek-and-quick-window/pull-link-into-peek.mp4
clip_zoom: 1.0                   # the preview sits beside the pointer; zooming in would crop it
