<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Field Notes</title>
  <style>
    body {
      margin: 0;
      font: 18px/1.6 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1d2330;
      background: #faf8f4;
    }

    main {
      max-width: 620px;
      margin: 56px auto;
      padding: 0 32px;
    }

    .kicker {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a6a4f;
    }

    h1 {
      margin: 8px 0 24px;
      font-size: 34px;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Field Notes</p>
    <h1>Watching the northern lights</h1>
    <p>The best nights are clear, dark and cold, well away from town lights. Give your eyes twenty minutes to adjust
      before you decide the sky is empty.</p>
    <p>Faint displays often look grey to the eye and green on a camera, so take a photo when you're unsure.</p>
  </main>
</body>
</html>
